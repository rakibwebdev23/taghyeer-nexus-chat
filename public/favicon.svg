<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC670"/>
      <stop offset="50%" stop-color="#FFB03A"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Border Ring -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#FFB03A" stroke-opacity="0.3" stroke-width="8"/>

  <!-- Glowing Background Accent -->
  <circle cx="256" cy="240" r="160" fill="#FFB03A" opacity="0.15" filter="url(#amberGlow)"/>

  <!-- Main Speech Bubble Logo Mark -->
  <path d="M140 160 C 140 126.86 166.86 100 200 100 L 312 100 C 345.14 100 372 126.86 372 160 L 372 268 C 372 301.14 345.14 328 312 328 L 220 328 L 152 384 L 164 328 C 150 316 140 294 140 268 Z" fill="url(#iconGrad)" filter="url(#amberGlow)"/>

  <!-- Inner Chat Symbol Dots -->
  <circle cx="216" cy="214" r="18" fill="#0F172A"/>
  <circle cx="256" cy="214" r="18" fill="#0F172A"/>
  <circle cx="296" cy="214" r="18" fill="#0F172A"/>
</svg>
